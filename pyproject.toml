[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbdetect"
version = "0.1.0"
description = "Whitelist vs. Blacklist detection across granularity levels"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "nltk>=3.8",
    "matplotlib>=3.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]
api = ["openai>=1.0", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["wbdetect*"]
