# Official Qwen3-4B Kirchenbauer prefix-KL training run.
# At max_length, 1024 steps * 128 examples/step * 4096 tokens/example
# processes 536,870,912 padded sequence tokens.
model: Qwen/Qwen3-4B-Base
run_name: qwen3-4b-fineweb-prefix-kl-lora
loss_mode: nll
strategy: block
concatenation_space: token
n_bits: 8
alpha: 1.0
delta: 1.0
max_length: 4096
max_steps: 1024
learning_rate: 0.0003
warmup_steps: 300
global_batch_size: 128
per_device_batch_size: 2
gradient_accumulation_steps: null
validation_samples: 1000
eval_steps: 4
save_steps: 256
save_total_limit: 4
logging_steps: 1
lora_rank: 32
lora_alpha: 16
lora_dropout: 0.05
dtype: bfloat16
report_to: wandb
wandb_project: null
resume_from_checkpoint: null
profile_memory_steps: 0
