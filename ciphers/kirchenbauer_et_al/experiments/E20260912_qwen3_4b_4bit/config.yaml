# Qwen3-4B four-bit Kirchenbauer prefix-KL training run.
# Training data-token budget: 256 steps * 128 documents * 1024 tokens = 33,554,432.
# Training plus validation requires 32,768 + 256 = 33,024 filtered documents.
# Control-prefix tokens are additional; the padding guard requires real data in every slot.

# --- PrefixKLTrainer constructor and model setup ---
model: Qwen/Qwen3-4B-Base
loss_mode: nll
strategy: block
n_bits: 4
alpha: 1.0
delta: 2.0
profile_memory_steps: 0

# --- Dataset and collator; SFTConfig adds the tokenized prefix to data_length ---
dataset_cache_name: fineweb-500k
min_gpt2_document_tokens: 756
min_qwen_document_tokens: 1024
reject_document_padding: true
data_length: 1024
validation_samples: 256

# --- PEFT LoraConfig ---
lora_rank: 32
lora_alpha: 16
lora_dropout: 0.05

# --- TRL SFTConfig ---
run_name: qwen3-4b-4bit-filtered-prefix-kl-lora
max_steps: 256
learning_rate: 0.0003
warmup_steps: 50
per_device_batch_size: 2
gradient_accumulation_steps: null
eval_steps: 4
save_steps: 256
save_total_limit: 5
logging_steps: 1
include_num_input_tokens_seen: non_padding
dtype: bfloat16
report_to: wandb

# --- Entrypoint orchestration around Trainer ---
global_batch_size: 128
wandb_project: null
wandb_tags:
  - stego-icml-2026-git-archive
resume_from_checkpoint: null
