paths_relative_to: repo_root

model:
  # Deterministic random initialization avoids downloading 4B model weights.
  # The full Qwen vocabulary keeps this compatible with the real tokenizer.
  weights: null
  weights_path: null
  config:
    model_type: qwen3
    vocab_size: 151936
    hidden_size: 32
    intermediate_size: 64
    num_hidden_layers: 1
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 8
    max_position_embeddings: 128
    tie_word_embeddings: true
    bos_token_id: 151643
    eos_token_id: 151643
  config_path: null
  tokenizer: Qwen/Qwen3-4B-Base
  tokenizer_path: null
  initialization_seed: 42

runtime:
  device: cpu
  dtype: float32

data:
  prefix_train_tokens: 8
  encoding_train_tokens: 8
  validation_tokens: 8
  generation_prompts: 2
  sequence_length: 16
  generation_prompt_length: 8
  min_sequence_length: 4
  dataset_seed: 42
  shuffle_buffer_size: 100

distillation:
  delta: 2.0
  vocab_seed: 42
  max_eval_sequences: 1

lora:
  task_type: CAUSAL_LM
  target_modules: all-linear
  r: 2
  lora_alpha: 4
  lora_dropout: 0.0
  bias: none

# Validated directly as trl.SFTConfig. The stage-specific artifact directory
# replaces output_dir at runtime.
training:
  output_dir: trainer_output
  use_cpu: true
  bf16: false
  fp16: false
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: constant
  logging_first_step: true
  logging_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  seed: 1234
  max_steps: 1
  gradient_checkpointing: false
  max_length: null
  packing: false
  padding_free: false
  completion_only_loss: false
  loss_type: nll
  use_liger_kernel: false
  report_to: none

generation:
  sampling_seed: 2026
  temperature: 0.7
  max_new_tokens: 8

wandb:
  mode: offline
  project: stego-kirchenbauer-binary-classification
  run_name: qwen3-tiny-cpu-smoke
  entity: null
