paths_relative_to: repo_root

model:
  # Hugging Face model/tokenizer IDs. For local artifacts, set the corresponding
  # *_path field instead; relative paths use paths_relative_to above.
  weights: Qwen/Qwen3-4B-Base
  weights_path: null
  config: null
  config_path: null
  tokenizer: Qwen/Qwen3-4B-Base
  tokenizer_path: null
  initialization_seed: 42

runtime:
  device: cuda
  dtype: bfloat16

data:
  prefix_train_tokens: 65536
  encoding_train_tokens: 65536
  validation_tokens: 16384
  generation_prompts: 256
  sequence_length: 256
  generation_prompt_length: 128
  min_sequence_length: 32
  dataset_seed: 42
  shuffle_buffer_size: 10000

distillation:
  delta: 2.0
  vocab_seed: 42
  max_eval_sequences: 16

lora:
  task_type: CAUSAL_LM
  target_modules: all-linear
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none

# Validated directly as trl.SFTConfig. The stage-specific artifact directory
# replaces output_dir at runtime.
training:
  output_dir: trainer_output
  use_cpu: false
  bf16: true
  fp16: false
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: constant
  logging_first_step: true
  logging_steps: 8
  eval_strategy: steps
  eval_steps: 32
  save_strategy: "no"
  seed: 1234
  max_steps: -1
  gradient_checkpointing: true
  max_length: null
  packing: false
  padding_free: false
  completion_only_loss: false
  loss_type: nll
  use_liger_kernel: false
  report_to: none

generation:
  sampling_seed: 2026
  temperature: 0.7
  max_new_tokens: 200

wandb:
  mode: online
  project: stego-kirchenbauer-binary-classification
  run_name: qwen3-4b-base-fineweb-64k
  entity: null
